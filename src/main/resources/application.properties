spring.application.name=rmms-backend

# Optional local-only overrides (real DB / admin passwords for running on
# localhost). This file is git-ignored and never committed. Missing in prod =
# no error, thanks to "optional:". See application-local.properties.
spring.config.import=optional:file:./application-local.properties

# -----------------------------
# Database Connection
# -----------------------------
# Real credentials must NOT be committed. Provide them at runtime via an
# external config, e.g. --spring.config.location=file:/opt/klrams/config/application.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/rmms
spring.datasource.username=rmms_user
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

# -----------------------------
# Database connection pool
# -----------------------------
# Default HikariCP pool (10) throttles concurrent DB-bound requests too early
# for 50-100 concurrent staff users; Postgres itself defaults to
# max_connections=100, so there's headroom to raise this.
spring.datasource.hikari.maximum-pool-size=30

# -----------------------------
# Server
# -----------------------------
server.port=8090
# nginx terminates TLS and proxies plain HTTP to this app (see
# deploy/nginx-klrams.conf.sample), so without this, Spring never sees the
# request as HTTPS: request.isSecure() is false, Spring Security's HSTS
# header (which only fires on requests it deems secure) never gets sent, and
# HttpServletResponse.sendRedirect() on relative paths (login/logout) would
# resolve to http:// instead of https://. This makes Spring trust
# X-Forwarded-Proto/-Host/-Port from the proxy so both work correctly. Safe
# only because docker-compose binds the app to 127.0.0.1 — nginx is the only
# thing that can reach it, so these headers cannot be spoofed by a client.
server.forward-headers-strategy=framework

# -----------------------------
# Session cookie hardening (CSRF defence)
# -----------------------------
# SameSite=Strict stops the browser from attaching the session cookie to ANY
# cross-site request, so a malicious page cannot make an authenticated staff
# browser fire state-changing calls (classic CSRF) — including any mutating
# endpoint that is reachable via GET. This replaces the
# token-based CSRF that is disabled in SecurityConfig for the static frontend.
# http-only keeps the cookie unreadable to JavaScript (defends against XSS theft).
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
# Mark the session cookie Secure in production (served over HTTPS behind nginx),
# so it is never transmitted over plain HTTP. Left OFF by default so local dev on
# http://localhost:8090 still logs in; the container turns it on via COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# -----------------------------
# File Upload Limits
# -----------------------------
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1

# -----------------------------
# Storage Directories
# -----------------------------
# Only the two directories the app actually writes to are configured. Uploads
# that used to need scratch space (shapefiles, Excel, images, reports, temp) are
# parsed in the browser and arrive as GeoJSON/JSON, so nothing is staged on disk
# for them; settings for those paths were read by no code and have been removed.
app.video-dir=/opt/klrams/data/videos
# Drone module: original GeoTIFF uploads and the PNG tile pyramids built from
# them. Sits on the same persistent volume as the rest, because a rebuilt image
# must not lose a survey — and because rebuilding a pyramid is minutes of CPU.
app.drone-dir=/opt/klrams/data/drone

# -----------------------------
# Place-name search (the viewer's "find a place" box)
# Proxied server-side so it works on office networks that reach KLRAMS but not
# third-party hosts, and so one identified caller honours the provider's rate
# limit instead of every browser separately. Point `url` at a self-hosted
# Nominatim to remove the external dependency, or set enabled=false to turn the
# box into coordinates-only (which needs no service at all).
# -----------------------------
app.geocode.enabled=true
app.geocode.url=https://nominatim.openstreetmap.org/search
app.geocode.user-agent=KLRAMS/1.0 (Kerala PWD road asset management)

# -----------------------------
# Map pages — served to the browser as window.KL_CONFIG by
# ClientConfigController (/js/runtime-config.js), so these can be changed
# without touching any JS module.
#
# glyphs-url — MapLibre needs a glyph server to draw ANY symbol label. The
#              default is MapLibre's public *demo* host, which carries no
#              availability promise: if it is down, every label disappears.
#              Point this at a self-hosted glyph server for production.
# routing-url— the Measure & Route panel's routing service. The default is the
#              public OSRM demo server: rate-limited, unsupported, and not to be
#              relied on. Host your own OSRM or use a keyed routing API.
# center/zoom— where the map opens. Was repeated in five files.
# -----------------------------
app.map.glyphs-url=https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf
app.map.center-lng=76.95
app.map.center-lat=8.52
app.map.zoom=9
app.routing.url=https://router.project-osrm.org/route/v1/driving/

# -----------------------------
# KLRAMS Admin Login (bootstrap super-admin — set the real password in
# external config, never here). Used only to seed the first account.
# -----------------------------
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:}

# -----------------------------
# HTTP Compression (gzip) — shrinks GeoJSON ~5-10x over the wire
# NOTE: browsers/Spring label JS as "text/javascript", so it MUST be listed
# explicitly or every .js module ships uncompressed (~4x larger).
# -----------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json,text/plain,text/css,application/javascript,text/javascript,image/svg+xml,application/vnd.mapbox-vector-tile
server.compression.min-response-size=1024

# -----------------------------
# Vector tiles (/api/segments/tiles/{z}/{x}/{y}.mvt)
# extent   — the tile's internal coordinate grid. 4096 is the MVT default and
#            what every client assumes; changing it changes rendering precision.
# buffer   — margin in those units so a segment crossing a tile edge is drawn
#            past the seam instead of being cut at it.
# max-zoom — the deepest tile address accepted; anything beyond is a 400 rather
#            than a pointless query.
# -----------------------------
app.tile.extent=4096
app.tile.buffer=64
app.tile.max-zoom=20

# -----------------------------
# Static asset caching — every JS/CSS include is cache-busted with ?v=NNN
# (see map.html), so it is safe to cache aggressively. Without this, Spring
# Security stamps "no-store" on assets and the browser re-downloads all ~30
# JS modules + CSS on every page load and every navigation. The matching
# WebSecurityCustomizer in SecurityConfig lets these headers survive.
# -----------------------------
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.use-last-modified=true
